# Dependency update PRs (issue #10). Each one runs CI's pull_request jobs, which
# need no secrets, so the protected `CI / required` gate (worker, python and the
# browser soak) checks it before anyone merges. Open PRs are capped per ecosystem.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/wiki"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: "development"
        update-types: ["minor", "patch"]

  - package-ecosystem: "pip"
    directory: "/"  # requirements-ci.txt
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3

  - package-ecosystem: "github-actions"
    directory: "/"  # SHA-pinned actions get reviewed bumps
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
