name: wikidata batch poller

# Always-on replacement for the macOS launchd watcher (org.wikilean.poll): runs
# bot/poll.py on GitHub's infra so the @[wikidata] batch pipeline advances
# (settle on gate-met, open next batch on merge, self-heal a CI cache stall) with
# no laptop. The runner is a general Linux VM — it pushes to the Deicyde/mathlib4
# fork and opens PRs against leanprover-community/mathlib4 main exactly as the
# laptop does, using a PAT (NOT the default GITHUB_TOKEN, which is scoped to this
# repo only).
#
# SECRETS to create (Settings → Secrets and variables → Actions):
#   MATHLIB_FORK_PAT        classic PAT (scope: repo) owned by Deicyde — pushes
#                           the branch to Deicyde/mathlib4 and opens/comments on
#                           the leanprover-community/mathlib4 PR. (A fork PR needs
#                           no write access to mathlib — any authed user can open
#                           one; the PAT just is your `gh login`.)
#   CLAUDE_CODE_OAUTH_TOKEN from `claude setup-token` on your Mac — lets triage.py
#                           run `claude -p` against your Max subscription headless
#                           (avoids the out-of-credits ANTHROPIC_API_KEY).
#   PIPELINE_TOKEN          the wiki bot bearer (same value as wiki/.dev.vars
#                           PIPELINE_TOKEN) for the /queue publish.
#
# STATE: the runner is stateless, so bot state (bot/state/{bot_state,recycle_queue,
# cut_log,brain_queue}.json + batchN_approved.json) is persisted by committing it
# back to THIS repo at the end of each run ([skip ci], only when it changed). The laptop
# launchd poller MUST be retired once this is live, or the two diverge.

on:
  schedule:
    # BUDGET: private repo bills 1 min/run min (rounded up). At */30 that's ~1460
    # no-op min/month + the rare heavy settle/open runs (~250-350) ≈ ~1750, under
    # the 2,000-min Free allowance. The HARD guarantee against ever being charged
    # is the account's $0 Actions spending limit (Settings → Billing → Cost
    # management): if the allowance is ever exhausted, runs PAUSE — no overage.
    - cron: '*/30 * * * *'        # every 30 min (GitHub may delay under load)
  workflow_dispatch:               # run on demand
    inputs:
      force_heavy:
        description: "Force the heavy setup + apply even if decide=wait (one-off validation)"
        type: boolean
        default: false

permissions:
  contents: write                  # commit the advanced poll state back

concurrency:
  group: wikidata-poll             # never two ticks at once
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    # Heavy ticks (open / settle / conflict-resolve) do NO Lean build anymore — the open
    # adds the CrossRefAttribute import deterministically and lets mathlib CI compile
    # (commit 80a4741), so a heavy tick is git-clone + apply + gh + the triage LLM =
    # minutes. 30m is generous headroom; no-op (decide=wait) ticks still exit in ~12s.
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"        # stream poll/open_batch print()s live (no 40m of silence)
      REPO: leanprover-community/mathlib4
      MATHLIB: ${{ github.workspace }}/_mathlib4
      WIKILEAN_CROSSREF_DIR: ${{ github.workspace }}/_crossref
      WIKILEAN_BASH: bash          # Linux: native bash 4+/GNU coreutils, no brew
    steps:
      - name: Checkout WikiLean without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Each later network step supplies its own GH_TOKEN. Git reads that token
      # through this prompt helper, so no credential is written to config or a
      # remote URL. The helper script itself contains no secret.
      - name: Configure non-persistent Git authentication
        run: |
          askpass="$RUNNER_TEMP/wikilean-git-askpass"
          printf '%s\n' \
            '#!/bin/sh' \
            'case "$1" in' \
            '  *Username*) printf "%s\n" "x-access-token" ;;' \
            '  *) printf "%s\n" "$GH_TOKEN" ;;' \
            'esac' > "$askpass"
          chmod 700 "$askpass"
          echo "GIT_ASKPASS=$askpass" >> "$GITHUB_ENV"
          echo "GIT_TERMINAL_PROMPT=0" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Refresh Brain queue
        run: python3 bot/brain_queue.py

      # ---- cheap gh-only decision: act or wait? ----
      - name: Decide
        id: decide
        env:
          GH_TOKEN: ${{ secrets.MATHLIB_FORK_PAT }}
        run: |
          if [ "${{ inputs.force_heavy }}" = "true" ]; then
            echo "act=true" >> "$GITHUB_OUTPUT"; echo "forced heavy path (validation)"; exit 0
          fi
          python3 bot/poll.py --mathlib /tmp/unused --decide | tee /tmp/decide.txt
          if grep -q 'POLL_DECISION=act' /tmp/decide.txt; then
            echo "act=true" >> "$GITHUB_OUTPUT"
          else
            echo "act=false" >> "$GITHUB_OUTPUT"
          fi

      # ---- heavy setup + the real tick, only when acting ----
      # No Lean toolchain step: the live path runs no `lake` (open adds the import + trusts
      # mathlib CI; settle uses split.py --no-build; conflict-resolve uses --reapply, no
      # build). Re-add an elan install here if a local build is ever reintroduced.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.decide.outputs.act == 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: .github/claude-cli/package-lock.json
      - name: Install pinned Claude CLI
        if: steps.decide.outputs.act == 'true'
        run: |
          npm ci --prefix .github/claude-cli
          echo "$GITHUB_WORKSPACE/.github/claude-cli/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Clone mathlib4 (fork origin + upstream)
        if: steps.decide.outputs.act == 'true'
        run: |
          git clone --filter=blob:none https://github.com/Deicyde/mathlib4.git "$MATHLIB"
          git -C "$MATHLIB" remote add upstream https://github.com/leanprover-community/mathlib4.git
          git -C "$MATHLIB" config user.name  "wikilean-bot"
          git -C "$MATHLIB" config user.email "bot@wikilean.jackmccarthy.org"

      - name: Poll tick (apply)
        if: steps.decide.outputs.act == 'true'
        env:
          GH_TOKEN: ${{ secrets.MATHLIB_FORK_PAT }}
          WIKILEAN_API_TOKEN: ${{ secrets.PIPELINE_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # On a merge, auto-populate Wikidata P14534 from the just-merged tags.
          # WIKILEAN_PUSH_PROPERTY gates the whole step. When enabling it, add
          # QUICKSTATEMENTS_TOKEN here so the credential remains step-local.
          WIKILEAN_PUSH_PROPERTY: "0"
          QUICKSTATEMENTS_USER: "Mynus grey"
        run: |
          git config --global user.name  "wikilean-bot"
          git config --global user.email "bot@wikilean.jackmccarthy.org"
          python3 bot/poll.py --mathlib "$MATHLIB" --apply

      # ---- persist advanced state back to this repo ----
      - name: Commit poll state
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name  "wikilean-bot"
          git config user.email "bot@wikilean.jackmccarthy.org"
          git add bot/state/ bot/data/ 2>/dev/null || true   # advanced state + the harvested feedback corpus (pool_candidates stays ignored)
          if git diff --cached --quiet; then
            echo "no state change"
          else
            git commit -m "bot: advance @[wikidata] poll state [skip ci]"
            git push
          fi

      # ---- keep the tag table's Reviews column current between open & settle ----
      # Cheap (gh + /api/review only, no lean/mathlib): re-post the OPEN PR's table so
      # reviewers' verdicts appear as they land, not just at open/settle. pr_table is
      # idempotent and skips the write when unchanged, so this runs every tick — incl.
      # the no-op waits, which is exactly when reviews trickle in.
      - name: Refresh tag table
        if: always()
        env:
          GH_TOKEN: ${{ secrets.MATHLIB_FORK_PAT }}
        run: python3 bot/poll.py --mathlib /tmp/unused --refresh-table
