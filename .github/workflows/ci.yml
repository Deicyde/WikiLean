name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: wiki
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: wiki/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and test Worker
        run: npm run test:ci

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install deterministic test dependencies
        run: python -m pip install --requirement requirements-ci.txt

      - name: Run deterministic Python checks
        run: scripts/ci-python.sh

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
    defaults:
      run:
        working-directory: wiki
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: wiki/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npm run test:e2e

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-failure-artifacts
          path: |
            wiki/playwright-report/
            wiki/test-results/
          if-no-files-found: ignore
          retention-days: 7

  required:
    if: always()
    needs: [worker, python]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify required jobs
        env:
          WORKER_RESULT: ${{ needs.worker.result }}
          PYTHON_RESULT: ${{ needs.python.result }}
        run: |
          if [[ "$WORKER_RESULT" != "success" || "$PYTHON_RESULT" != "success" ]]; then
            echo "Required CI failed: worker=$WORKER_RESULT python=$PYTHON_RESULT"
            exit 1
          fi
          echo "Required CI passed: worker=$WORKER_RESULT python=$PYTHON_RESULT"
